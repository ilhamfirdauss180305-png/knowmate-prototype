<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - KnowMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- BAGIAN ATAS -->

        <section class="auth-intro">

            <a href="index.html" class="auth-logo">
                KnowMate
            </a>

            <div class="auth-intro-content">

                <span class="auth-label">
                    Mulai Perjalanan Belajarmu
                </span>

                <h1>
                    Bergabung dengan
                    <span>KnowMate.</span>
                </h1>

                <p>
                    Buat akun KnowMate dan temukan berbagai buku serta
                    referensi yang sesuai dengan perjalanan kuliahmu.
                </p>

            </div>

            <div class="auth-decoration">

                <div class="auth-decoration-circle"></div>

                <div class="auth-mini-book">

                    <div class="auth-mini-cover">
                        <strong>KNOW</strong>
                    </div>

                    <div class="auth-mini-page">
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>

                </div>

            </div>

        </section>


        <!-- FORM DAFTAR -->

        <section class="auth-form-section">

            <div class="auth-form-box register-form-box">

                <div class="auth-form-header">

                    <h2>
                        Buat Akun
                    </h2>

                    <p>
                        Lengkapi data berikut untuk mendaftar.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- NAMA -->

                    <div class="form-group">

                        <label for="registerName">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Masukkan nama lengkap"
                            required
                        >

                    </div>


                    <!-- NIM -->

                    <div class="form-group">

                        <label for="registerNim">
                            NIM
                        </label>

                        <input
                            type="text"
                            id="registerNim"
                            placeholder="Masukkan NIM"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Masukkan email"
                            required
                        >

                    </div>


                    <!-- UNIVERSITAS -->

                    <div class="form-group">

                        <label for="registerUniversity">
                            Universitas
                        </label>

                        <input
                            type="text"
                            id="registerUniversity"
                            placeholder="Masukkan nama universitas"
                            required
                        >

                    </div>


                    <!-- PROGRAM STUDI -->

                    <div class="form-group">

                        <label for="registerStudy">
                            Program Studi
                        </label>

                        <input
                            type="text"
                            id="registerStudy"
                            placeholder="Contoh: Psikologi"
                            required
                        >

                    </div>


                    <!-- SEMESTER -->

                    <div class="form-group">

                        <label for="registerSemester">
                            Semester
                        </label>

                        <select
                            id="registerSemester"
                            required
                        >

                            <option value="">
                                Pilih semester
                            </option>

                            <option value="1">
                                Semester 1
                            </option>

                            <option value="2">
                                Semester 2
                            </option>

                            <option value="3">
                                Semester 3
                            </option>

                            <option value="4">
                                Semester 4
                            </option>

                            <option value="5">
                                Semester 5
                            </option>

                            <option value="6">
                                Semester 6
                            </option>

                            <option value="7">
                                Semester 7
                            </option>

                        </select>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Buat password"
                            required
                        >

                    </div>


                    <!-- KONFIRMASI PASSWORD -->

                    <div class="form-group">

                        <label for="registerConfirmPassword">
                            Konfirmasi Password
                        </label>

                        <input
                            type="password"
                            id="registerConfirmPassword"
                            placeholder="Ulangi password"
                            required
                        >

                    </div>


                    <!-- TOMBOL -->

                    <button
                        type="submit"
                        class="auth-submit-button"
                    >
                        Daftar Sekarang
                    </button>

                </form>


                <div class="auth-divider">
                    <span>atau</span>
                </div>


                <div class="auth-register-link">

                    <p>
                        Sudah punya akun?
                        <a href="login.html">
                            Masuk sekarang
                        </a>
                    </p>

                </div>


                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Kembali ke halaman utama
                </a>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
